# A project without a url is shown without a link (for example while its repository is private).
# image is in assets/images/; kind is the short label under the name.
projects:
  - name: tk
    kind: Linux terminal
    image: images/tk.png
    dates: 2026
    summary: >-
      A personal terminal for Linux that you install once and use everywhere. It bundles everyday
      commands, a managed zsh setup, a right-click menu on files in the output, and a pane that
      shows Markdown, images and PDFs next to the shell.
    stack: [Rust, Electron, xterm.js, zsh]
  - name: The Systems Journal
    kind: Daily newsletter
    image: images/newsletter.jpg
    dates: 2026
    summary: >-
      A newspaper I get by email every morning on distributed systems, production engineering,
      Linux, protocols, security and quantum computing. Gemini searches the web for each section,
      and the pipeline keeps only stories whose links come from the search results, reads each
      article to write its summary, and tags how ready each subject is for production. Runs on
      GitHub Actions.
    stack: [Python, Gemini API, GitHub Actions, Jinja2]
  - name: Ngai
    kind: Browser game
    image: images/ngai.jpg
    dates: 2018, 2026
    url: https://guidona.github.io/ngai-game/
    summary: >-
      The traditional Tupuri game Ngai, a sowing game related to awalé, playable in the browser
      against a computer opponent that looks up to ten moves ahead. I'm writing down its rules and
      turning them into a game. Started for an AI course in 2018, documented in French.
    stack: [JavaScript, Python, Minimax, Alpha-beta pruning]

